
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#50191f">
<title>Atelier Crêpe — French Crêperie</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=DM+Sans:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #50191f;
  --bg-dark: #351015;
  --cream: #f0e5d8;
  --muted: #c7aaa0;
  --line: rgba(240,229,216,.25);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  background: radial-gradient(ellipse at 52% 42%, #68242a, #50191f 48%, #351015);
  font-family: "Italiana", Georgia, serif;
}

button {
  font: inherit;
}

.page {
  max-width: 1900px;
  min-height: 100vh;
  margin: auto;
  padding: 30px 4.7vw 24px;
  display: flex;
  flex-direction: column;
}

/* HEADER */

header {
  min-height: 105px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  border-bottom: 1px solid rgba(240,229,216,.16);
  padding-bottom: 18px;
}

.brand {
  text-decoration: none;
  color: var(--cream);
  width: fit-content;
}

.brand-name {
  font-family: "Great Vibes", cursive;
  font-size: clamp(43px, 4.4vw, 65px);
  line-height: .95;
  font-weight: 400;
  margin: 0;
}

.brand-sub {
  font-family: "DM Sans", sans-serif;
  font-size: 9px;
  letter-spacing: .36em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 10px 0 0 24px;
}

.nav {
  display: flex;
  gap: clamp(28px, 5vw, 75px);
}

.nav a {
  text-decoration: none;
  color: var(--cream);
  font-family: "DM Sans", sans-serif;
  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
  transition: opacity .25s;
}

.nav a:hover {
  opacity: .65;
}

/* MAIN MENU */

.hero {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(250px, .82fr) minmax(350px, 1.45fr) minmax(175px, .65fr);
  align-items: center;
  gap: 2vw;
  min-height: 680px;
  padding: 25px 0;
}

/* LEFT INFORMATION */

.left-panel {
  padding-left: 2vw;
  position: relative;
  z-index: 2;
}

.flavour-title {
  font-family: "Italiana", Georgia, serif;
  font-size: clamp(48px, 5vw, 76px);
  font-weight: 400;
  line-height: .94;
  letter-spacing: .045em;
  text-transform: uppercase;
  margin: 34px 0 16px;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  letter-spacing: .1em;
  margin: 0 0 22px;
}

.rule {
  width: 63px;
  height: 1px;
  background: var(--line);
  margin-bottom: 20px;
}

.description {
  max-width: 310px;
  color: #ead9cf;
  font-size: 16px;
  line-height: 1.7;
  letter-spacing: .025em;
  margin: 0;
}

.ingredients-label {
  margin: 23px 0 8px;
  color: var(--muted);
  font-family: "DM Sans", sans-serif;
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
}

.ingredients {
  max-width: 300px;
  font-size: 14px;
  line-height: 1.8;
  letter-spacing: .03em;
}

.price-row {
  display: flex;
  align-items: baseline;
  gap: 15px;
  margin-top: 24px;
}

.price-label {
  color: var(--muted);
  font-family: "DM Sans", sans-serif;
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
}

.price {
  font-size: 25px;
  letter-spacing: .04em;
}

/* MAIN PRODUCT PHOTO */

.photo-stage {
  position: relative;
  width: 100%;
  height: min(68vh, 690px);
  min-height: 460px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.main-photo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  filter: drop-shadow(0 22px 28px rgba(20,5,7,.22));
  transition: opacity .3s ease, transform .4s ease;
}

.main-photo.fade {
  opacity: 0;
  transform: scale(.97);
}

.photo-caption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(240,229,216,.55);
  font-family: "DM Sans", sans-serif;
  font-size: 8px;
  letter-spacing: .2em;
  text-transform: uppercase;
  pointer-events: none;
}

/* RIGHT MENU */

.right-panel {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.crepe-choice {
  width: 100%;
  display: grid;
  grid-template-columns: 78px 1fr;
  align-items: center;
  gap: 13px;
  padding: 8px 0;
  background: none;
  border: 0;
  color: var(--cream);
  text-align: left;
  cursor: pointer;
  opacity: .58;
  transition: opacity .25s ease, transform .25s ease;
}

.crepe-choice:hover,
.crepe-choice.active {
  opacity: 1;
}

.crepe-choice:hover {
  transform: translateX(-3px);
}

.choice-image {
  width: 78px;
  height: 105px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.choice-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 7px 9px rgba(15,4,5,.2));
  transition: transform .3s ease;
}

.crepe-choice:hover img,
.crepe-choice.active img {
  transform: scale(1.06);
}

.choice-info {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.choice-line {
  width: 25px;
  height: 1px;
  background: var(--line);
  transition: width .3s;
}

.crepe-choice.active .choice-line {
  width: 42px;
  background: var(--cream);
}

.choice-name {
  font-size: 13px;
  line-height: 1.5;
  letter-spacing: .15em;
  text-transform: uppercase;
}

/* FOOTER */

footer {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 32px;
  color: var(--muted);
  font-family: "DM Sans", sans-serif;
  font-size: 8px;
  line-height: 1.9;
  letter-spacing: .25em;
  text-transform: uppercase;
  padding-top: 12px;
}

.footer-line {
  height: 1px;
  background: var(--line);
}

/* WELCOME BANNER */

.welcome-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 24px;
  background: #50191f;
  opacity: 1;
  visibility: visible;
  transition: opacity .65s ease, visibility .65s ease;
}

.welcome-screen.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.welcome-card {
  position: relative;
  width: min(1120px, 100%);
  min-height: min(690px, calc(100vh - 48px));
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  border: 1px solid rgba(240,229,216,.25);

  /* Burgundy background */
  background-color: #50191f;

  /* New transparent girl image */
  background-image: url("https://cdn.shopify.com/s/files/1/0843/5554/7384/files/Image_f91e3690-8cc9-42c3-a30e-6f581bf373ac.png?v=1791833792");

  /* Keep the entire girl visible */
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center center;

  cursor: pointer;
  color: var(--cream);
  text-align: center;
}

.welcome-card::after {
  content: "";
  position: absolute;
  inset: 14px;
  border: 1px solid rgba(240,229,216,.4);
  pointer-events: none;
}

.welcome-copy {
  position: relative;
  z-index: 1;
  padding: 45px 25px 65px;
  pointer-events: none;
}

.welcome-kicker,
.welcome-hint {
  font-family: "DM Sans", sans-serif;
  font-size: 9px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: #fff0e7;
}

.welcome-title {
  font-family: "Great Vibes", cursive;
  font-size: clamp(58px, 10vw, 112px);
  font-weight: 400;
  line-height: 1;
  margin: 18px 0;
  text-shadow: 0 3px 25px rgba(0,0,0,.25);
}

.welcome-hint {
  margin-top: 24px;
  font-size: 10px;
  transition: letter-spacing .3s;
}

.welcome-card:hover .welcome-hint {
  letter-spacing: .4em;
}

/* ABOUT AND LOCATION POPUP */

.info-overlay {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(20,5,8,.72);
}
