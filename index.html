

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#50151f">

<title>Atelier Crêpe — French Crêperie</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap');

:root {
  --burgundy: #50151f;
  --burgundy-dark: #3d1018;
  --cream: #f4eadf;
  --muted: #c9aaa1;
  --line: rgba(244,234,223,.25);
  --accent: #d7b99d;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--burgundy);
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
}

/* PAGE */

.menu-page {
  width: 100%;
  max-width: 1700px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 38px 6.2vw 30px;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding-bottom: 27px;
  border-bottom: 1px solid var(--line);
}

.logo {
  text-decoration: none;
  color: var(--cream);
  display: inline-block;
  width: fit-content;
}

.logo-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(27px, 3vw, 39px);
  line-height: 1;
  letter-spacing: -.04em;
  margin: 0;
  font-weight: 400;
}

.logo-subtitle {
  font-size: 9px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 10px 0 0 2px;
}

.header-center {
  font-size: 9px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--muted);
}

.header-right {
  justify-self: end;
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
}

/* INTRO */

.intro {
  text-align: center;
  padding: 65px 0 45px;
}

.eyebrow {
  color: var(--accent);
  font-size: 9px;
  letter-spacing: .36em;
  text-transform: uppercase;
  margin: 0 0 17px;
}

.intro h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(36px, 5vw, 61px);
  font-weight: 400;
  letter-spacing: -.035em;
  line-height: 1.1;
  margin: 0;
}

.intro-description {
  color: var(--muted);
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 15px;
  font-style: italic;
  margin: 15px 0 0;
}

/* MENU CARDS */

.menu-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 27px;
  width: 100%;
  max-width: 1150px;
  margin: 0 auto;
}

.crepe-card {
  appearance: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 0;
  border: 1px solid rgba(244,234,223,.22);
  background: transparent;
  color: var(--cream);
  text-align: left;
  cursor: pointer;
  transition: border-color .3s ease, transform .3s ease;
  font: inherit;
}

.crepe-card:hover {
  border-color: rgba(244,234,223,.7);
  transform: translateY(-5px);
}

.crepe-card.active {
  border-color: var(--accent);
}

.image-wrap {
  width: 100%;
  aspect-ratio: 1 / 1.08;
  background: #f0e5d9;
  overflow: hidden;
  position: relative;
}

.image-wrap img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform .55s ease;
}

.crepe-card:hover .image-wrap img {
  transform: scale(1.045);
}

.card-content {
  padding: 23px 21px 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card-topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.card-number {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .2em;
}

.card-price {
  color: var(--accent);
  font-size: 12px;
  letter-spacing: .08em;
  white-space: nowrap;
}

.card-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(20px, 2vw, 27px);
  font-weight: 400;
  line-height: 1.2;
  margin: 0;
}

.card-description {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  margin: 10px 0 19px;
  min-height: 38px;
}

.card-action {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: 15px;
  margin-top: auto;
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--cream);
}

.card-arrow {
  font-size: 18px;
  transition: transform .25s ease;
}

.crepe-card:hover .card-arrow,
.crepe-card.active .card-arrow {
  transform: translateX(5px);
  color: var(--accent);
}

/* SELECTED CREPE DETAILS */

.details-section {
  max-width: 850px;
  width: 100%;
  margin: 55px auto 0;
  padding: 30px 35px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 25px;
  align-items: center;
  transition: opacity .25s ease;
}

.details-label {
  color: var(--accent);
  font-size: 9px;
  letter-spacing: .3em;
  text-transform: uppercase;
  margin: 0 0 12px;
}

.details-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 28px;
  font-weight: 400;
  margin: 0 0 12px;
}

.details-ingredients {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
  letter-spacing: .04em;
  margin: 0;
}

.details-price {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 27px;
  white-space: nowrap;
  color: var(--cream);
}

/* FOOTER */

.footer {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 25px;
  margin-top: auto;
  padding-top: 55px;
}

.footer-line {
  height: 1px;
  background: var(--line);
}

.footer-center {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .24em;
  text-transform: uppercase;
  text-align: center;
}

.footer-right {
  justify-self: end;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
}

/* RESPONSIVE */

@media (max-width: 850px) {
  .menu-page {
    padding: 28px 4vw;
  }

  .menu-grid {
    gap: 15px;
  }

  .card-content {
    padding: 17px 15px;
  }

  .details-section {
    margin-top: 40px;
  }
}

@media (max-width: 600px) {
  .menu-page {
    padding: 22px 19px;
  }

  .header {
    grid-template-columns: 1fr auto;
    padding-bottom: 21px;
  }

  .header-center {
    display: none;
  }

  .logo-name {
    font-size: 30px;
  }

  .header-right {
    font-size: 8px;
  }

  .intro {
    padding: 48px 0 32px;
  }

  .intro h1 {
    font-size: 39px;
  }

  .intro-description {
    font-size: 13px;
  }

  .menu-grid {
    grid-template-columns: 1fr;
    gap: 19px;
    max-width: 420px;
  }

  .crepe-card {
    display: grid;
    grid-template-columns: 42% 58%;
    min-height: 165px;
  }

  .image-wrap {
    aspect-ratio: auto;
    height: 100%;
    min-height: 165px;
  }

  .card-content {
    padding: 17px 15px;
  }

  .card-title {
    font-size: 22px;
  }

  .card-description {
    font-size: 10px;
    min-height: 0;
    margin: 8px 0 14px;
  }

  .card-action {
    padding-top: 11px;
    font-size: 8px;
  }

  .details-section {
    grid-template-columns: 1fr auto;
    gap: 12px;
    padding: 25px 4px;
    margin-top: 35px;
  }

  .details-title {
    font-size: 23px;
  }

  .details-ingredients {
    font-size: 11px;
  }

  .details-price {
    font-size: 22px;
  }

  .footer {
    grid-template-columns: 1fr;
    gap: 14px;
    padding-top: 38px;
  }

  .footer-line {
    display: none;
  }

  .footer-right {
    justify-self: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="menu-page">

  <!-- HEADER -->
  <header class="header">

    <a href="#" class="logo">
      <p class="logo-name">Atelier Crêpe</p>
      <p class="logo-subtitle">French Crêperie</p>
    </a>

    <div class="header-center">
      Made with love · Served fresh
    </div>

    <div class="header-right">
      Menu · 01—03
    </div>

  </header>


  <!-- INTRO -->
  <section class="intro">

    <p class="eyebrow">Our selection</p>

    <h1>A little moment of sweetness.</h1>

    <p class="intro-description">
      French crêpes, thoughtfully prepared.
    </p>

  </section>


  <!-- THREE CREPES -->
  <main>

    <section class="menu-grid" aria-label="Crêpe menu">

      <!-- CREPE 01 -->
      <button
        class="crepe-card active"
        type="button"
        data-crepe="0"
        aria-pressed="true"
      >

        <div class="image-wrap">
          <img
            src="https://cdn.shopify.com/s/files/1/0843/5554/7384/files/Image_438.jpg?v=1791811725"
            alt="French crêpe with Nutella, strawberries and banana"
            loading="eager"
          >
        </div>

        <div class="card-content">

          <div class="card-topline">
            <span class="card-number">01 / SIGNATURE</span>
            <span class="card-price">2,500 AMD</span>
          </div>

          <h2 class="card-title">Berry Choco</h2>

          <p class="card-description">
            A classic combination of chocolate and fresh fruit.
          </p>

          <div class="card-action">
            <span>Discover ingredients</span>
            <span class="card-arrow">→</span>
          </div>

        </div>

      </button>


      <!-- CREPE 02 -->
      <button
        class="crepe-card"
        type="button"
        data-crepe="1"
        aria-pressed="false"
      >

        <div class="image-wrap">
          <img
            src="https://cdn.shopify.com/s/files/1/0843/5554/7384/files/Image_440.jpg?v=1791811727"
            alt="French crêpe with white cream and fresh raspberries"
            loading="lazy"
          >
        </div>

        <div class="card-content">

          <div class="card-topline">
            <span class="card-number">02 / DELICATE</span>
            <span class="card-price">2,500 AMD</span>
          </div>

          <h2 class="card-title">Raspberry Cloud</h2>

          <p class="card-description">
            Soft white cream and the delicate taste of raspberries.
          </p>

          <div class="card-action">
            <span>Discover ingredients</span>
            <span class="card-arrow">→</span>
          </div>

        </div>

      </button>


      <!-- CREPE 03 -->
      <button
        class="crepe-card"
        type="button"
        data-crepe="2"
        aria-pressed="false"
      >

        <div class="image-wrap">
          <img
            src="https://cdn.shopify.com/s/files/1/0843/5554/7384/files/Image_441.jpg?v=1791811728"
            alt="French crêpe with Biscoff Lotus cream and biscuits"
            loading="lazy"
          >
        </div>

        <div class="card-content">

          <div class="card-topline">
            <span class="card-number">03 / INDULGENT</span>
            <span class="card-price">2,700 AMD</span>
          </div>

          <h2 class="card-title">Lotus Dream</h2>

          <p class="card-description">
            Smooth Biscoff cream with a delicious biscuit crunch.
          </p>

          <div class="card-action">
            <span>Discover ingredients</span>
            <span class="card-arrow">→</span>
          </div>

        </div>

      </button>

    </section>


    <!-- INGREDIENTS PANEL -->
    <section class="details-section" id="crepe-details" aria-live="polite">

      <div>

        <p class="details-label" id="details-label">
          01 · Selected crêpe
        </p>

        <h2 class="details-title" id="details-title">
          Berry Choco
        </h2>

        <p class="details-ingredients" id="details-ingredients">
          Nutella · Fresh strawberries · Banana
        </p>

      </div>

      <div class="details-price" id="details-price">
        2,500 AMD
      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="footer">

    <div class="footer-line"></div>

    <div class="footer-center">
      Atelier Crêpe · French Crêperie
    </div>

    <div class="footer-right">
      Made fresh, just for you
    </div>

  </footer>

</div>


<script>
(function () {

  const crepes = [
    {
      name: "Berry Choco",
      ingredients: "Nutella · Fresh strawberries · Banana",
      price: "2,500 AMD"
    },
    {
      name: "Raspberry Cloud",
      ingredients: "White cream · Fresh raspberries",
      price: "2,500 AMD"
    },
    {
      name: "Lotus Dream",
      ingredients: "Biscoff Lotus cream · Lotus biscuits",
      price: "2,700 AMD"
    }
  ];

  const cards = document.querySelectorAll(".crepe-card");

  const detailsLabel = document.getElementById("details-label");
  const detailsTitle = document.getElementById("details-title");
  const detailsIngredients = document.getElementById("details-ingredients");
  const detailsPrice = document.getElementById("details-price");

  function selectCrepe(index) {

    const crepe = crepes[index];

    if (!crepe) return;

    cards.forEach((card, cardIndex) => {

      const isSelected = cardIndex === index;

      card.classList.toggle("active", isSelected);

      card.setAttribute(
        "aria-pressed",
        isSelected ? "true" : "false"
      );

    });

    detailsLabel.textContent =
      "0" + (index + 1) + " · Selected crêpe";

    detailsTitle.textContent = crepe.name;

    detailsIngredients.textContent = crepe.ingredients;

    detailsPrice.textContent = crepe.price;

  }

  cards.forEach((card) => {

    card.addEventListener("click", function () {

      const index = Number(this.dataset.crepe);

      selectCrepe(index);

      if (window.innerWidth <= 600) {
        document.getElementById("crepe-details").scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });
      }

    });

  });

})();
</script>

</body>
</html>
